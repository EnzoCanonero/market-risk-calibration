[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "market-risk-calibration"
version = "0.1.0"
description = "A focused study of calibration for market-risk forecasts"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Enzo Canonero"}]
dependencies = [
    "numpy==2.0.2",
    "pandas==2.3.3",
    "scipy==1.13.1",
]

[project.optional-dependencies]
dev = [
    "mypy==1.19.1",
    "pandas-stubs==2.2.2.240807",
    "pytest==8.4.2",
    "ruff==0.16.9",
]
notebooks = [
    "ipykernel==6.29.5",
    "matplotlib==3.9.4",
    "nbconvert==7.16.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.9"
mypy_path = "src"
files = ["src/market_risk_calibration", "experiments", "tests"]
disallow_untyped_defs = true
explicit_package_bases = true

# SciPy 1.13 has no type stubs compatible with Python 3.9.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
